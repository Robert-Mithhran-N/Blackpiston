<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <h1>BlackPiston Debug Test</h1>
    <div id="status">Testing...</div>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        const status = document.getElementById('status');
        
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = msg;
            results.appendChild(div);
        }
        
        // Test 1: Basic JavaScript
        log('✅ JavaScript is working');
        
        // Test 2: Check if React is loaded
        try {
            if (typeof React !== 'undefined') {
                log('✅ React is loaded');
            } else {
                log('⚠️ React not loaded (expected in dev mode)');
            }
        } catch (e) {
            log('⚠️ React check: ' + e.message);
        }
        
        // Test 3: API Connection
        fetch('http://localhost:3001/api/health')
            .then(r => r.json())
            .then(data => {
                log('✅ Backend API connected: ' + data.message);
            })
            .catch(e => {
                log('❌ Backend API failed: ' + e.message, true);
            });
        
        // Test 4: Check main app
        setTimeout(() => {
            fetch('http://localhost:5000/')
                .then(r => r.text())
                .then(html => {
                    if (html.includes('root')) {
                        log('✅ Main HTML has root div');
                    } else {
                        log('❌ Main HTML missing root div', true);
                    }
                })
                .catch(e => {
                    log('❌ Main HTML check failed: ' + e.message, true);
                });
            
            status.textContent = 'Tests complete. Check results above.';
        }, 1000);
    </script>
</body>
</html>
